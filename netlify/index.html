
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardik's Data Mining Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #fffaf5;
    color: #292524;
}

body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
}

.top {
    flex-shrink: 0;
    padding: 14px 4%;
    background: linear-gradient(120deg, #fff7ed, #ffedd5);
    border-bottom: 1px solid #fed7aa;
}

h1 {
    margin: 0;
    color: #9a3412;
    font-size: clamp(19px, 2.5vw, 30px);
}

.top p {
    margin: 5px 0 0;
    color: #57534e;
    font-size: clamp(12px, 1.3vw, 15px);
}

.wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    padding: 10px 2%;
    display: flex;
    flex-direction: column;
}

.frame {
    display: block;
    flex: 1;
    min-height: 0;
    width: 100%;
    border: 1px solid #e7d5c5;
    border-radius: 12px;
    background: white;
}

.notice {
    flex-shrink: 0;
    margin: 5px 0 0;
    text-align: center;
    font-size: 11px;
    color: #78716c;
}

/* Mobile screens */
@media (max-width: 600px) {
    .top {
        padding: 10px 14px;
    }

    .wrap {
        padding: 6px;
    }

    .frame {
        border-radius: 8px;
    }

    .notice {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<header class="top">
    <h1>🤖 Hardik's Data Mining Chatbot</h1>
    <p>Your study assistant for concepts, numericals and exam preparation.</p>
</header>

<main class="wrap">
    <iframe
        class="frame"
        src="https://data-mining-chatbot.onrender.com"
        title="Data Mining Chatbot"
        allow="clipboard-read; clipboard-write">
    </iframe>

    <div class="notice">
        Free hosting may take around a minute to wake up after inactivity.
        Please wait for the chatbot to load.
    </div>
</main>

</body>
</html>
